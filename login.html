<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome Back | Wood &amp; Grain Studio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">

  <!-- RTL & Theme controls outside the card at the top right corner (Issue 20) -->
  <div class="auth-corner-tools">
    <button class="iconbtn" data-rtl-toggle aria-label="Toggle RTL" title="Toggle RTL">⇄</button>
    <button class="iconbtn" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">◐</button>
  </div>

  <!-- Centered Authentication Card Container -->
  <div class="auth-card-container">
    <div class="auth-card">

      <!-- Brand name inside the card, aligned to center -->
      <div class="card-brand">
        <a class="brand" href="index.html">
          <span class="brandmark">✦</span>
          <span>WOOD &amp; GRAIN STUDIO</span>
        </a>
      </div>

      <div class="auth-heading">
        <span class="eyebrow">Client Portal</span>
        <h2>Welcome Back</h2>
        <p>Access your commission briefs, carving progress and invoices.</p>
      </div>

      <form data-demo-form>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <!-- Password field with eye toggle icon (Issue 13) -->
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" required minlength="6" placeholder="Enter your password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <!-- Checkbox changed to Remember me on this device (Issue 13) -->
        <div class="auth-options">
          <div class="field-checkbox">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me on this device</label>
          </div>
          <a href="#" style="color:var(--brand);font-size:.85rem;font-weight:500">Forgot password?</a>
        </div>
        <button class="btn" style="width:100%" type="submit">Sign in ↗</button>
      </form>

      <!-- Centered Social Auth Icons with crisp SVGs: Google, Apple, Facebook (Issue 14) -->
      <div class="auth-divider"><span>OR CONTINUE WITH</span></div>
      <div class="auth-socials">
        <a href="#" class="auth-social-btn" aria-label="Sign in with Google" title="Google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </a>
        <a href="#" class="auth-social-btn" aria-label="Sign in with Apple" title="Apple">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.76 1.05-1.81.93-2.87-.91.04-2.02.61-2.66 1.36-.57.65-1.07 1.72-.94 2.76 1.02.08 2.05-.49 2.67-1.25z"/>
          </svg>
        </a>
        <a href="#" class="auth-social-btn" aria-label="Sign in with Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      </div>

      <div class="auth-links">
        New to the studio? <a href="signup.html" style="color:var(--brand);font-weight:700">Create an account</a>
      </div>

      <div class="auth-back-link">
        <a href="index.html">← Return to studio website</a>
      </div>

    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
